[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "maceh"
version = "0.1.0"
description = "MACE-H: equivariant neural network for Hamiltonian prediction"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "e3nn>=0.5",
    "h5py",
    "pymatgen",
    "ase",
    "scipy",
    "sympy",
    "tqdm",
    "pathos",
    "wandb",
    "opt-einsum-fx",
    "tensorboard",
]

# torch, and torch-geometric with dependencies should be installed
# separately before installing this package, e.g.:
#   pip install torch==2.4.0 torchvision==0.19.0 torchaudio==2.4.0 \
#       --index-url https://download.pytorch.org/whl/cu124
#   pip install torch_geometric
#   pip install pyg_lib torch_scatter torch_sparse torch_cluster \
#       -f https://data.pyg.org/whl/torch-2.4.0+cu124.html

[tool.setuptools.packages.find]
include = ["maceh*"]

[tool.setuptools.package-data]
maceh = ["default_configs/*.ini"]
